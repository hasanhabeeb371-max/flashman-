  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    @keyframes splash-pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.05);
        opacity: 0.8;
      }
    }

    .animate-splash {
      animation: splash-pulse 2s infinite ease-in-out;
    }
  </style>
